[package]
name = "vibeterm"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "A native, GPU-rendered Linux terminal"
license = "MIT"

[dependencies]
alacritty_terminal = "=0.26.0"
anyhow = "1"
arboard = { version = "3.6", features = ["wayland-data-control"], default-features = false }
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4.5", features = ["derive"] }
glyphon = "=0.9.0"
libc = "0.2"
lru = "0.12"
pollster = "0.4"
portable-pty = "=0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
wgpu = { version = "25", default-features = false, features = ["vulkan", "gles", "wgsl"] }
winit = "0.30"

[profile.release]
lto = "thin"
codegen-units = 1
